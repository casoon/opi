name: Release

# A version tag verifies the crate and creates the GitHub release.
#
# Publishing is NOT part of this workflow. `cargo publish` is run from a
# maintainer machine, so the registry token stays there rather than living in
# repository secrets, and releasing stays a deliberate step instead of a side
# effect of pushing a tag.
#
# workflow_dispatch runs the verification only, as a dry run before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Verify package
        run: cargo package --locked
      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "crate=$crate_version tag=$tag_version"
          test "$crate_version" = "$tag_version"

      - name: Confirm the version is on crates.io
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: opi release workflow' \
            "https://crates.io/api/v1/crates/opi/${version}")"
          if [ "$status" != "200" ]; then
            echo "opi ${version} is not on crates.io (HTTP ${status})."
            echo "Run 'cargo publish' locally before pushing the tag."
            exit 1
          fi
          echo "opi ${version} is published."

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
