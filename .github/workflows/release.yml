name: Release

# A version tag verifies the crate, builds the release binaries and creates the
# GitHub release. The binaries are what install.sh downloads.
#
# Publishing is NOT part of this workflow. `cargo publish` is run from a
# maintainer machine, so the registry token stays there rather than living in
# repository secrets, and releasing stays a deliberate step instead of a side
# effect of pushing a tag.
#
# workflow_dispatch runs the verification and the builds without releasing, as
# a dry run before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Verify package
        run: cargo package --locked
      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "crate=$crate_version tag=$tag_version"
          test "$crate_version" = "$tag_version"

      - name: Confirm the version is on crates.io
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: opi release workflow' \
            "https://crates.io/api/v1/crates/opi/${version}")"
          if [ "$status" != "200" ]; then
            echo "opi ${version} is not on crates.io (HTTP ${status})."
            echo "Run 'cargo publish' locally before pushing the tag."
            exit 1
          fi
          echo "opi ${version} is published."

  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Linux is built against musl so one binary runs everywhere rather
          # than against the glibc of whatever runner built it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          name="opi-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/opi" "dist/${name}/opi"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
