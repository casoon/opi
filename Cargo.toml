[package]
name = "opi"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Operations Interface — a project control center for your terminal"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/opi"
repository = "https://github.com/casoon/opi"
keywords = ["cli", "package-json", "scripts", "task-runner", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["plan/**", "konzept.txt", "docs/**"]

[dependencies]
glob = "0.3.4"
runemark = { version = "0.5.1", features = ["select"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
